name: Writ certificate transport integration validation

on:
  push:
    branches:
      - codex/writ-transport-integration-validation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned Decision Lab adapter
        uses: actions/checkout@v4
      - name: Checkout exact Writ integration source
        uses: actions/checkout@v4
        with:
          repository: saykig/Writ
          ref: 2c4b533f747e3d9ac7beb358a42b7dcaddb6d5c8
          path: Writ
      - name: Set up CPython 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: Writ/.bun-version
      - name: Install Writ dependencies
        working-directory: Writ
        run: bun install --frozen-lockfile
      - name: Build Writ provenance dependency
        working-directory: Writ
        run: bun run --filter '@writ/provenance' build
      - name: Install exact Build 2 backend
        run: python -m pip install scipy==1.17.0
      - name: Run all real Decision Lab integration gates
        working-directory: Writ
        env:
          WRIT_DECISION_LAB_ROOT: ${{ github.workspace }}
          WRIT_DECISION_LAB_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: |
          bun run test:decision-integration
          bun run test:shared-analysis-integration
          bun run test:certificate-transport-integration
